# Publie le rapport du validateur de packs en commentaire de la Pull Request (un seul commentaire, mis à jour à chaque passage).
# Séparé de pack-check.yml : ce workflow a le droit d'écrire un commentaire, mais n'exécute aucun code de la Pull Request.
name: Rapport des packs
on:
  workflow_run:
    workflows: ["Validation des packs"]
    types: [completed]
permissions:
  actions: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pack-report
          path: out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const pr = Number(fs.readFileSync("out/pr.txt", "utf8").trim());
            if (!Number.isInteger(pr) || pr <= 0) throw new Error("numéro de Pull Request invalide");
            const head = context.payload.workflow_run.head_sha;
            const { data: info } = await github.rest.pulls.get({ ...context.repo, pull_number: pr });
            if (info.head.sha !== head) { core.info("rapport d'un ancien commit, ignoré"); return; }
            let body = fs.existsSync("out/report.md") ? fs.readFileSync("out/report.md", "utf8") : "<!-- validateur-de-packs -->\nLa validation n'a pas pu aller au bout : voir les journaux de l'action.";
            body = body.slice(0, 64000) + `\n\n<sub>Commit ${head.slice(0, 7)} · [journal de la validation](${context.payload.workflow_run.html_url})</sub>`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr, per_page: 100 });
            const old = comments.find((c) => c.user.type === "Bot" && c.body.includes("<!-- validateur-de-packs -->"));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
