<title>Arène Hueco Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&family=Spectral+SC:wght@600;700&display=swap">
<style>
/* Layout: a night duel mat — board centred (opponent on top, you at the bottom), log and chat beside it on desktop, below it on phones. One deliberate dark look: the Hueco Mundo night. */
:root {
  color-scheme: dark;
  --night: #0a0f1e;      /* page ground */
  --felt: #111a33;       /* board mat */
  --zone: #18223f;       /* empty zone */
  --line: rgba(222, 230, 255, .16);
  --ink: #e8ecf8;
  --dim: #95a1c4;
  --sand: #efe4cc;       /* desert sand, primary buttons */
  --me: #6fe0b0;         /* your side, Cero green */
  --opp: #ff8f7e;        /* opponent */
  --warn: #ffd166;
  --font-display: "Spectral SC", Georgia, serif;
  --font-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --cw: clamp(36px, calc((min(100vw, 600px) - 96px) / 7), 76px);
  --ch: calc(var(--cw) * 1.457);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--night); color: var(--ink); }
body { margin: 0; font: 400 14px/1.4 var(--font-ui); padding-inline: 16px; padding-block: 12px 32px; }
button { font: 600 13px/1 var(--font-ui); color: var(--ink); background: #1d2850; border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; cursor: pointer; }
button:hover { background: #26346a; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--sand); color: #1a1408; border-color: var(--sand); }
button.primary:hover { background: #fff6e2; }
button.ghost { background: transparent; }
button.danger { color: var(--opp); border-color: rgba(255, 143, 126, .5); background: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, .cell:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
input, select { font: 400 14px var(--font-ui); color: var(--ink); background: #0e1630; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: clamp(26px, 5vw, 40px); line-height: 1; }
h2 { font-size: 20px; }
.muted { color: var(--dim); }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.row-btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.panel { background: var(--felt); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.banner { border: 1px solid rgba(255, 209, 102, .45); background: rgba(255, 209, 102, .08); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.chip { font: 500 11px/1 var(--font-num); padding: 4px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }

/* lobby */
.lobby { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .lobby { grid-template-columns: minmax(0, 1fr); } }
.games { display: grid; gap: 8px; }
.game { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #0e1630; }
.game .nm { font-weight: 800; overflow-wrap: anywhere; }
.seatline { display: flex; flex-wrap: wrap; gap: 6px; grid-column: 1 / -1; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 18px; color: var(--dim); text-align: center; }

/* table */
.table { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .table { grid-template-columns: minmax(0, 1fr); } }
.turnbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.phases { display: flex; flex-wrap: wrap; gap: 3px; }
.phases span { font: 500 11px/1 var(--font-num); padding: 6px 7px; border-radius: 4px; color: var(--dim); border: 1px solid transparent; }
.phases span.on { color: #0a0f1e; background: var(--me); }
.mat { background: radial-gradient(ellipse at 50% 50%, #17244a 0, var(--felt) 65%); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; justify-items: center; overflow: hidden; }
.side { display: grid; gap: 4px; }
.zrow { display: grid; grid-template-columns: repeat(7, var(--cw)); gap: 6px; }
.lpbar { width: 100%; max-width: calc(var(--cw) * 7 + 36px); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; }
.lp { font: 500 22px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.who { font-weight: 800; display: flex; gap: 6px; align-items: center; min-width: 0; }
.who .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.lpctl { display: flex; gap: 4px; align-items: center; }
.lpctl input { width: 74px; font-family: var(--font-num); }
.lpctl button { padding: 7px 9px; }
.cell { width: var(--cw); height: var(--ch); border-radius: 4px; background: var(--zone); border: 1px solid var(--line); position: relative; display: grid; place-items: center; cursor: pointer; }
.cell.blank { background: transparent; border-color: transparent; cursor: default; }
.cell.emz { border-style: dashed; }
.cell .lbl { font: 500 8px/1.1 var(--font-num); color: var(--dim); text-align: center; text-transform: uppercase; letter-spacing: .06em; padding: 2px; }
.cell.target { border-color: var(--me); box-shadow: 0 0 0 2px var(--me) inset; background: rgba(111, 224, 176, .12); }
.cell.target-opp { border-color: var(--opp); box-shadow: 0 0 0 2px var(--opp) inset; }
.cell.sel { box-shadow: 0 0 0 2px var(--sand); }
.card { width: var(--cw); height: var(--ch); border-radius: 3px; overflow: hidden; position: relative; transition: transform .15s; background: #222; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.oimg { width: 100%; height: 100%; background-size: 1000% 1000%; background-repeat: no-repeat; background-color: #141828; }
.card.def { transform: rotate(90deg) scale(.69); }
.card.peek img { opacity: .55; }
.card .tag { position: absolute; left: 2px; bottom: 2px; font: 500 8px/1 var(--font-num); background: rgba(0, 0, 0, .75); color: var(--ink); padding: 2px 3px; border-radius: 2px; }
.badge { position: absolute; right: -5px; top: -5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--sand); color: #1a1408; font: 600 10px/18px var(--font-num); text-align: center; z-index: 2; }
.badge.mats { left: -5px; right: auto; background: #b48bcf; color: #12081c; }
.back { width: 100%; height: 100%; background: radial-gradient(ellipse 34% 26% at 50% 50%, #e9c46a 0 18%, #8a4b1d 19% 44%, #3d1f0c 45% 70%, #1e0f06 71%); border: 2px solid #2a1709; border-radius: 3px; }
.ttile { width: 100%; height: 100%; padding: 4px; display: flex; align-items: center; justify-content: center; text-align: center; font: 700 calc(var(--cw) * .14)/1.1 var(--font-ui); color: #10131c; overflow: hidden; overflow-wrap: anywhere; border: 3px solid rgba(0, 0, 0, .35); }
.k-n { background: #e6c878; } .k-e { background: #e8934f; } .k-r { background: #7fa6dc; } .k-fu { background: #a585c9; } .k-sy { background: #ececec; }
.k-xy { background: #2c2c30; color: #f2f2f2; } .k-l { background: #3a73bd; color: #f2f2f2; }
.k-m { background: #e8934f; } .k-s { background: #3db497; } .k-t { background: #cf6c9a; } .k-x { background: #9a7ac0; } .k-tok { background: #b9b9b9; }
.pilecount { position: absolute; inset: auto 0 2px 0; text-align: center; font: 600 11px/1 var(--font-num); color: #fff; text-shadow: 0 1px 2px #000; }
.hand { width: 100%; display: flex; gap: 6px; overflow-x: auto; padding: 6px 2px 8px; min-height: calc(var(--ch) + 16px); justify-content: safe center; }
.hand .card { flex: none; cursor: pointer; }
.hand.opp .card { width: calc(var(--cw) * .7); height: calc(var(--ch) * .7); cursor: default; }
.hand .card:hover { transform: translateY(-4px); }
.mid { font: 500 10px var(--font-num); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.log { display: grid; gap: 4px; max-height: 52vh; overflow-y: auto; font-size: 12.5px; padding-right: 4px; }
.log .e { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; }
.log .w { font-weight: 800; }
.log .chat { color: var(--sand); }
.chatform { display: flex; gap: 6px; }
.chatform input { flex: 1; }

/* sheet + modal */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #0f1731; border-top: 1px solid var(--line); box-shadow: 0 -12px 40px rgba(0, 0, 0, .55); padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); max-height: 72vh; overflow-y: auto; }
.sheet .in { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; }
@media (max-width: 560px) { .sheet .in { grid-template-columns: 96px minmax(0, 1fr); } }
.sheet .pv { width: 100%; aspect-ratio: 59 / 86; border-radius: 6px; overflow: hidden; }
.sheet .pv img { width: 100%; height: 100%; object-fit: cover; }
.sheet .pv .ttile { font-size: 15px; }
.sheet .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.sheet .acts button { padding: 9px 11px; }
.sheet .txt { font-size: 13px; color: #cfd6ea; max-width: 70ch; white-space: pre-line; }
.modal { position: fixed; inset: 0; z-index: 15; background: rgba(4, 7, 16, .78); display: grid; place-items: center; padding: 16px; }
.modal .box { width: min(860px, 100%); max-height: 86vh; overflow-y: auto; background: var(--felt); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.grid-cards .card { width: 100%; height: auto; aspect-ratio: 59 / 86; cursor: pointer; }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30; background: var(--sand); color: #1a1408; font-weight: 600; padding: 10px 14px; border-radius: 8px; max-width: calc(100vw - 32px); }

/* deck editor */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .editor { grid-template-columns: minmax(0, 1fr); } }
.cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.citem { display: grid; gap: 6px; }
.citem .card { width: 100%; height: auto; aspect-ratio: 59 / 86; cursor: pointer; }
.cnt { display: grid; grid-template-columns: 30px 1fr 30px; align-items: center; text-align: center; font: 500 13px var(--font-num); }
.cnt button { padding: 5px 0; }
.dlist { display: grid; gap: 3px; font-size: 13px; max-height: 46vh; overflow-y: auto; }
.dlist .l { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.dlist .l span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlist .l button { padding: 3px 7px; }
.ok { color: var(--me); } .bad { color: var(--opp); }
.ores { display: grid; gap: 4px; max-height: 420px; overflow-y: auto; }
.ores .r { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #0e1630; }
.ores .sw { width: 10px; height: 30px; border-radius: 2px; }
.ores .t { min-width: 0; } .ores .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.ores .t small { color: var(--dim); }
.ores .cnt { grid-template-columns: 28px 22px 28px; }
.addtxt { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; }
@media (max-width: 560px) { .addtxt { grid-template-columns: minmax(0, 1fr) auto; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" id="app"><p class="muted">Chargement de l'arène…</p></div>
<div class="modal" id="modal" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const PH = ["Pioche", "Standby", "Main 1", "Combat", "Main 2", "Fin"];
const KIND = { m: "Monstre", s: "Magie", t: "Piège", x: "Extra Deck" };
const FIELD = new Set(["m", "s", "e", "fz"]);
const ZNAME = { hand: "main", deck: "Deck", extra: "Extra Deck", gy: "Cimetière", ban: "bannie", m: "Zone Monstre", e: "Zone Monstre Extra", s: "Zone Magie/Piège", fz: "Zone Terrain", mat: "Matériel" };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const DEMO = { name: "Hueco Mundo · démo", main: { "HMUN-FR001": 3, "HMUN-FR006": 3, "HMUN-FR004": 1, "HMUN-FR009": 2, "HMUN-FR011": 2, "HMUN-FR013": 2, "HMUN-FR020": 3, "HMUN-FR005": 3, "HMUN-FR022": 2, "HMUN-FR014": 1, "HMUN-FR016": 1, "HMUN-FR018": 1, "HMUN-FR002": 3, "HMUN-FR003": 3, "HMUN-FR007": 2, "HMUN-FR021": 1, "HMUN-FR023": 1, "HMUN-FR026": 1, "HMUN-FR008": 1, "HMUN-FR024": 2, "HMUN-FR025": 2 }, extra: { "HMUN-FR010": 2, "HMUN-FR012": 2, "HMUN-FR015": 1, "HMUN-FR017": 1, "HMUN-FR019": 1 } };

const S = {
  db: null, user: null, uid: null, canWrite: null, holder: null, name: store.get("name") || "",
  view: "lobby", games: [], gid: null, game: null, seat: null, seats: {}, mine: null,
  decks: [], editing: null, sheet: null, modal: null, placing: null, armed: null, solo: false, ready: false,
  unsub: [], pubW: null, privW: null, gameW: null, deckW: null, readOnly: false,
};
let CAT = {}, CATLIST = [];
const IDX = new Map(), ALIAS = {}, DETAIL = {}, CHUNK = {}, OIMG = new Map();
let IDXLIST = [], idxReady = false;
const norm = (t) => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
async function loadIndex() {
  try {
    const d = await (await fetch("ygo/index.json")).json();
    Object.assign(ALIAS, d.alias || {});
    IDXLIST = d.cards.map(([id, n, en, k, f, field]) => { const o = { cid: "ygo:" + id, id, name: n, en: en || "", kind: k, frame: f, field: !!field, key: norm(n + " " + (en || "")) }; IDX.set(o.cid, o); return o; });
    idxReady = true; render(); if (S.sheet) renderSheet();
  } catch (e) { idxReady = false; }
}
// Images des cartes officielles : planches de 10 × 10 vignettes (ygo/img/<n>.jpg), carte ids[i] en case i % 100 de la planche i // 100
async function loadImages() {
  try {
    const { ids } = await (await fetch("ygo/img.json")).json();
    ids.forEach((id, i) => { if (id) OIMG.set(id, i); });
    render(); if (S.sheet) renderSheet();
  } catch (e) {}
}
function officialImg(id) {
  const i = OIMG.get(id);
  if (i == null) return null;
  const s = i % 100;
  return { url: `ygo/img/${Math.floor(i / 100)}.jpg`, pos: `${((s % 10) / 9) * 100}% ${(Math.floor(s / 10) / 9) * 100}%` };
}
function detail(cid) {
  if (DETAIL[cid] || !cid.startsWith("ygo:")) return DETAIL[cid] || null;
  const id = +cid.slice(4), n = id % 100;
  if (!CHUNK[n]) CHUNK[n] = fetch(`ygo/d/${n}.json`).then((r) => r.json()).then((ch) => { for (const k in ch) DETAIL["ygo:" + k] = { line: ch[k][0], stats: ch[k][1], text: ch[k][2] }; if (S.sheet) renderSheet(); }).catch(() => {});
  return null;
}

/* ---------- cartes ---------- */
function meta(cid) {
  if (!cid) return { name: "Carte posée", kind: "m" };
  if (CAT[cid]) return CAT[cid];
  if (cid.startsWith("ygo:")) { const o = IDX.get(cid), d = detail(cid); if (!o) return { cid, name: idxReady ? "Carte inconnue" : "Chargement…", kind: "m", frame: "e", text: "" }; return { ...o, line: d ? d.line : "", stats: d ? d.stats : "", text: d ? d.text : "Chargement du texte…" }; }
  if (cid === "token") return { name: "Jeton", kind: "tok", line: "Jeton", text: "" };
  if (cid.startsWith("txt:")) { const [, k, ...n] = cid.split(":"); return { cid, name: n.join(":"), kind: k, line: KIND[k] + " (carte officielle)", text: "" }; }
  return { name: cid, kind: "m", text: "" };
}
const isExtra = (cid) => meta(cid).kind === "x";
function faceHTML(cid) {
  const m = meta(cid);
  if (m.img) return `<img src="${esc(m.img)}" alt="${esc(m.name)}" loading="lazy">`;
  const oi = m.id && officialImg(m.id);
  if (oi) return `<div class="oimg" role="img" aria-label="${esc(m.name)}" style="background-image:url('${oi.url}');background-position:${oi.pos}"></div>`;
  return `<div class="ttile k-${esc(m.frame || m.kind)}">${esc(m.name)}</div>`;
}
function cardHTML(c, { own, attrs = "", cls = "", count } = {}) {
  if (!c) return "";
  const down = c.f === "down", show = c.c && (!down || own);
  const k = ["card", c.p === "def" ? "def" : "", down && own ? "peek" : "", cls].filter(Boolean).join(" ");
  const inner = show ? faceHTML(c.c) : `<div class="back"></div>`;
  const tag = down && own ? `<span class="tag">posée</span>` : "";
  const badge = (c.n ? `<span class="badge">${c.n}</span>` : "") + (c.m && c.m.length ? `<span class="badge mats" title="Matériels">${c.m.length}</span>` : "");
  const cnt = count != null ? `<span class="pilecount">${count}</span>` : "";
  return `<div class="${k}" ${attrs}>${inner}${tag}${cnt}</div>${badge}`;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const bare = (c) => ({ u: c.u, c: c.c });

/* ---------- état d'un joueur ---------- */
function freshSide() { return { started: false, lp: 8000, m: [null, null, null, null, null], s: [null, null, null, null, null], fz: null, e: [null, null], gy: [], ban: [], deck: [], hand: [], extra: [], log: [], deckName: "" }; }
function pubCard(c) { if (!c) return null; const o = { u: c.u, f: c.f || "up", p: c.p || "atk", n: c.n || 0, m: (c.m || []).map(bare) }; if (o.f !== "down") o.c = c.c; return o; }
function pubOf(M) {
  return { holder: S.holder, name: S.name, started: !!M.started, lp: M.lp, m: M.m.map(pubCard), s: M.s.map(pubCard), fz: pubCard(M.fz), e: M.e.map(pubCard),
    gy: M.gy.map(bare), ban: M.ban.map(bare), hand: M.hand.length, deck: M.deck.length, extra: M.extra.length, log: M.log.slice(-50), deckName: M.deckName || "", upd: Date.now() };
}
function log(x, kind) { const M = S.mine; if (!M) return; M.log.push({ t: Date.now(), x, k: kind || "" }); if (M.log.length > 60) M.log.splice(0, M.log.length - 60); }
const nm = (c) => meta(c.c).name;

/* ---------- écritures (une à la fois par document) ---------- */
function writer(ref, mode = "set") {
  let busy = false, pending = null;
  async function flush() {
    busy = true;
    while (pending) {
      const d = pending; pending = null;
      try { await (mode === "set" ? ref.set(d) : ref.update(d)); }
      catch (e) { dbError(e); }
    }
    busy = false;
  }
  return (d) => { pending = mode === "update" && pending ? merge(pending, d) : d; if (!busy) flush(); };
}
function merge(a, b) { const o = { ...a }; for (const k in b) o[k] = b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) ? merge(a[k] || {}, b[k]) : b[k]; return o; }
function dbError(e) {
  const code = e && e.code;
  if (code === "invalid_argument") { S.readOnly = true; toast("Tu n'as pas le droit d'écrire ici. Le propriétaire doit t'inviter comme Éditeur."); render(); }
  else if (code === "quota_exceeded") toast("La base de l'arène est pleine : supprime d'anciennes parties.");
  else if (code === "resource_exhausted") toast("Trop d'actions d'un coup, ralentis un peu.");
  else if (code && code !== "unavailable") toast("Erreur de connexion (" + code + ").");
}
let saveT = null;
function commit() { render(); clearTimeout(saveT); saveT = setTimeout(flushSave, 120); }
function flushSave() {
  const M = S.mine; if (!M || !S.seat) return;
  store.set(privKey(), M);
  if (S.privW) S.privW({ seat: S.seat, side: M });
  if (S.pubW) S.pubW(pubOf(M));
}
const privKey = () => `priv-${S.gid}-${S.seat}`;

/* ---------- déplacements ---------- */
function take(loc) {
  const M = S.mine; let c = null;

function officialResults(d) {
  const q = norm((S.osq || "").trim());

  if (!hits.length) return `<span class="muted">Aucune carte trouvée.</span>`;
  const qty = (cid) => (isExtra(cid) ? d.extra : d.main)[cid] || 0;
  return hits.map((o) => `<div class="r"><span class="sw k-${o.frame}"></span><div class="t"><b data-a="preview" data-c="${o.cid}">${esc(o.name)}</b><small>${esc(o.en)}${o.en ? " · " : ""}${{ m: "Monstre", x: "Extra Deck", s: "Magie", t: "Piège" }[o.kind]}</small></div>

}
function importYdk(text, deck) {
  let part = "main", ok = 0, miss = 0; deck.main = {}; deck.extra = {};
  for (const raw of text.split(/\r?\n/)) {
    const l = raw.trim();
    if (l === "#main") part = "main"; else if (l === "#extra") part = "extra"; else if (l === "!side") part = "side";
    if (!/^\d+$/.test(l) || part === "side") continue;
    const id = ALIAS[l] || +l, cid = "ygo:" + id;

  return { ok, miss };
}

/* ---------- réseau : parties ---------- */
async function openGame(gid, seat) {
  leaveGame();
  S.gid = gid; S.seat = seat; S.view = "table"; S.seats = {}; S.game = { name: "" };
  if (S.solo) { S.game = { name: "Entraînement", turn: "A", phase: 0, turnNo: 1 }; S.mine = store.get(privKey()) || freshSide(); return render(); }
  const db = S.db, gref = db.doc("games/" + gid);
  S.gameW = writer(gref, "update");
  S.unsub.push(gref.onSnapshot((snap) => { if (!snap.exists) { if (S.gid === gid && S.game && S.game.created) { toast("Cette partie a été supprimée"); goLobby(); } return; } S.game = { ...snap.data() }; render(); }, dbError));
  S.unsub.push(db.collection("games/" + gid + "/seats").onSnapshot((qs) => {
    qs.docs.forEach((d) => { S.seats[d.id] = d.data(); });
    if (S.seat && S.seats[S.seat] && S.seats[S.seat].holder && S.seats[S.seat].holder !== S.holder) { toast("Quelqu'un d'autre a pris ta place"); S.seat = null; S.mine = null; S.pubW = S.privW = null; }
    render();
  }, dbError));
  if (seat) {
    store.set("seat-" + gid, seat);
    S.pubW = writer(db.doc(`games/${gid}/seats/${seat}`));
    let saved = null;
    if (S.uid) {
      // Une sauvegarde par place : le même compte peut tenir les deux places sur deux appareils
      const col = db.collection("data/users/" + S.uid), pref = col.doc(`g-${gid}-${seat}`);
      S.privW = writer(pref);
      try {
        const s = await pref.get();
        if (s.exists) saved = s.data().side;
        else { const old = await col.doc("g-" + gid).get(); if (old.exists && old.data().seat === seat) saved = old.data().side; }
      } catch (e) {}
    }
    saved = saved || store.get(privKey());
    S.mine = saved || freshSide();
    flushSave();
  }
  render();
}
function leaveGame() { S.unsub.forEach((u) => { try { u(); } catch (e) {} }); S.unsub = []; S.pubW = S.privW = S.gameW = null; S.mine = null; S.seat = null; S.placing = null; closeSheet(); closeModal(); }
function goLobby() { leaveGame(); S.gid = null; S.view = "lobby"; render(); }
async function claim(gid, seat, takeover) {
  if (!S.name) { toast("Écris d'abord ton nom de duelliste"); $("#pname") && $("#pname").focus(); return; }
  const ref = S.db.doc(`games/${gid}/seats/${seat}`);
  try {
    const lease = await ref.acquire({ holder: S.holder, ttlMs: 5000 });
    if (!lease.acquired) return toast("Quelqu'un est en train de prendre cette place, réessaie.");
    const cur = await ref.get(), d = cur.exists ? cur.data() : null;
    if (d && d.holder && d.holder !== S.holder && !takeover) return toast("Cette place est déjà prise.");
    if (!d || d.holder !== S.holder) await ref.set({ ...pubOf(freshSide()), holder: S.holder, name: S.name });
    await S.db.doc("games/" + gid).update({ players: { [seat]: S.name }, holders: { [seat]: S.holder }, upd: Date.now() });
    openGame(gid, seat);
  } catch (e) { dbError(e); }
}

document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.dataset.a === "chat") { const v = ($("#chatin").value || "").trim(); if (!v) return; log(v, "chat"); $("#chatin").value = ""; commit(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "osearch") { S.osq = e.target.value; const box = document.querySelector(".ores"); if (box && S.editing) box.innerHTML = officialResults(S.editing); return; }
  if (e.target.id === "pname") { S.name = e.target.value.trim().slice(0, 24); store.set("name", S.name); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "ydk" && e.target.files[0] && S.editing) {
    const f = e.target.files[0];
    if (!idxReady) { toast("La base des cartes officielles se charge encore, réessaie dans un instant"); return; }
    f.text().then((t) => { const nmEl = $("#dname"); S.editing.name = (nmEl && nmEl.value && nmEl.value !== "Nouveau deck") ? nmEl.value : f.name.replace(/\.ydk$/i, ""); const r = importYdk(t, S.editing); toast(`${r.ok} cartes importées${r.miss ? `, ${r.miss} introuvables` : ""}`); render(); });
    return;
  }
  if (e.target.id === "pname" && S.mine && S.seat) { flushSave(); if (!S.solo) S.db.doc("games/" + S.gid).update({ players: { [S.seat]: S.name } }).catch(dbError); }
});

/* ---------- démarrage ---------- */
async function boot() {
  try { const r = await fetch("cards.json"); CATLIST = await r.json(); CATLIST.forEach((c) => (CAT[c.cid] = c)); } catch (e) { CATLIST = []; }
  S.decks = store.get("decks") || [];
  S.holder = store.get("holder") || rid(); store.set("holder", S.holder);
  const cl = window.claude;
  const [db, user] = cl && cl.use ? await Promise.all([cl.use("db").catch(() => null), cl.use("user").catch(() => null)]) : [null, null];
  S.db = db; S.user = user;
  if (!db) { S.solo = true; S.ready = true; return render(); }
  if (user) {
    S.uid = await user.id();
    if (S.uid) S.holder = S.uid;
    const w = await user.can("data.write"); if (w === false) S.readOnly = true;
    if (S.uid) {
      const dref = db.collection("data/users/" + S.uid).doc("decks");
      S.deckW = writer(dref);
      try { const s = await dref.get(); if (s.exists && Array.isArray(s.data().list)) { S.decks = s.data().list; store.set("decks", S.decks); } else if (S.decks.length) saveDecks(); } catch (e) {}
    }
  }
  S.unsub.length = 0;
  db.collection("games").orderBy("upd", "desc").limit(30).onSnapshot((qs) => { S.games = qs.docs.map((d) => ({ id: d.id, ...d.data() })); if (S.view === "lobby") render(); }, dbError);
  S.ready = true; render();
}
render(); boot(); loadIndex(); loadImages();
})();
</script>
